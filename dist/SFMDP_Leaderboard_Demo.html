function applyStandardTables(tables,data,notes){

 ['Hubungkan backend persisten','Gunakan Firebase Authentication dan Firestore. Pisahkan role admin internal dan viewer klien; validasi izin di backend dan Security Rules. Mode Presentasi bukan kontrol akses.'],
 ['Sinkronisasi otomatis','Saat admin membuka dashboard, polling backend setiap 60 detik. Tampilkan last successful sync, loading, error, dan retry. Polling ini hanya berjalan ketika dashboard admin terbuka; penjadwalan tanpa browser memerlukan scheduler server.'],
 ['Tinjau lalu publikasikan snapshot','Admin meninjau perubahan, kelengkapan dan aturan sebelum Publish results. Klien membaca hanya snapshot versi yang telah disetujui, bukan sumber mentah atau catatan fasil.'],
 ['Uji dua akun dan deploy','Uji admin, viewer, dan akun tanpa izin. Viewer tidak boleh bisa menulis walau memanggil API langsung. Deploy hanya setelah aturan final, data terverifikasi, dan akses lolos uji.']
 ].map(([t,p],i)=>`<div class="guide-step"><span class="step">${i+1}</span><div><h3>${t}</h3><p>${p}</p></div></div>`).join('')}</div></section><section class="card"><div class="card-head"><h2>Yang sudah / belum tersedia</h2></div><div class="card-body"><div class="check-line">${icon('check')}<span>Sudah: impor XLSX / CSV / JSON, pratinjau, hitung ulang, peringkat, filter, detail, ekspor, mode presentasi, logo asli.</span></div><div class="check-line">${icon('clock')}<span>Belum: koneksi akun, penyimpanan cloud bersama, login/role server, sinkronisasi Google Sheets, dan publikasi snapshot ke klien.</span></div><div class="check-line">${icon('shield')}<span>Paket prompt bertahap dan checklist pengujian ada dalam folder docs. Jangan gunakan localStorage atau tombol pemilih role sebagai pengganti autentikasi.</span></div></div></section>`;
}
function render(){
 document.body.classList.toggle('present',present);
 const pages={overview:overview,leaderboard:leaderboard,import:importPage,rules:rulesPage,integration:integrationPage};
 const nav=[['overview','overview','Ringkasan'],['leaderboard','trophy','Leaderboard'],['import','upload','Data & impor'],['rules','settings','Aturan & audit'],['integration','link','Integrasi & panduan']];
 document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand-mark"><div class="brand-icon">S</div><div class="brand-title">SFMDP<small>LEARNING LEADERBOARD</small></div></div><div class="nav-section">WORKSPACE</div><nav>${nav.map(([p,i,l])=>`<button class="nav-btn ${p===page?'active':''}" data-action="nav" data-page="${p}">${icon(i)}${l}</button>`).join('')}</nav><div class="side-bottom"><strong><span class="status-dot"></span>Prototype · local session</strong><p>Hitung & impor sudah aktif.<br>Google Sheets belum terhubung.<br>Backup sebelum menutup tab.</p></div></aside><main class="workarea"><header class="topbar"><div class="crumb">Freshminds × Astra Honda Motor<strong>Learning outcomes / ${year}</strong></div><div class="actions"><button class="btn exit-present" data-action="exit-present">Keluar presentasi</button><div class="brand-lockup"><img class="fm" src="${ASSETS.fm}" alt="Freshminds"><div class="brand-divider"></div><img class="ahm" src="${ASSETS.ahm}" alt="AHM - PT Astra Honda Motor"></div></div></header><div class="content"><div class="print-header"><img class="fm" src="${ASSETS.fm}" alt="Freshminds"><strong>SFMDP · ${year} · ${h(statusLabel())}</strong><img class="ahm" src="${ASSETS.ahm}" alt="AHM"></div><div class="dataset-strip"><div class="dataset-picker"><label for="project-year">PROYEK</label><select id="project-year"><option value="2025" ${year===2025?'selected':''}>2025 · Uji dengan data tahun sebelumnya</option><option value="2026" ${year===2026?'selected':''}>2026 · Proyek baru / Draft</option></select><span class="tag ${year===2025?'amber':'teal'}">${year===2025?'TEST DATA':'2026'}</span></div><span class="sub">${data().isSynthetic?'Data sintetis':(data().isAnonymous?'Identitas disamarkan':'Data internal')} · Sesi lokal</span></div>${pages[page]()}<footer class="footer"><span>Freshminds × AHM · SFMDP ${year} · ${h(statusLabel())}</span><span>Mode Presentasi bukan pembatasan akses · v1.0 prototype</span></footer></div></main></div>`;
}
function toast(message){const e=document.getElementById('toast');e.textContent=message;e.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display='none',5500);}
function download(name,content,type='text/plain;charset=utf-8'){
 const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function closeModal(){document.getElementById('modal-root').innerHTML='';pending=null;}
function modal(title,sub,body,foot=''){document.getElementById('modal-root').innerHTML=`<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-label="${h(title)}"><header class="modal-head"><div><h2>${h(title)}</h2><p>${sub}</p></div><button class="close" data-action="close" aria-label="Tutup">×</button></header><div class="modal-body">${body}</div>${foot?`<footer class="modal-foot">${foot}</footer>`:''}</section></div>`;document.querySelector('.modal .close')?.focus();}
function detail(id,s){
 const r=getRows(s).find(p=>p.id===id);if(!r)return;
 const individual=s==='individual',parts=year===2025?['Day 1','Day 2','Day 3','Day 4']:rulesStatus(data(),s).components.map(c=>c.label);
 let body=`<div class="detail-metrics"><div class="detail-metric"><span>Rank global</span><strong>${r.rank??'—'}</strong></div><div class="detail-metric"><span>Total skor</span><strong>${fmt(r.total)}</strong></div><div class="detail-metric"><span>Proyek</span><strong>${year}</strong></div><div class="detail-metric"><span>Status</span><strong style="font-size:14px">${year===2025?'Data uji':'Provisional'}</strong></div></div><h3>Kontribusi skor</h3>${parts.map((p,i)=>`<div class="detail-row"><span>${h(p)}</span><strong>${fmt(r.days?.[i]??null)}</strong></div>`).join('')}`;
 if(year===2025&&individual){body+='<h3 style="margin-top:23px">Nilai sumber</h3>'+Object.entries(r.legacyInputs||{}).filter(([k])=>k!=='post4_raw').map(([k,v])=>`<div class="detail-row"><span>${h(FIELD_LABELS[k]||k)}</span><span>${fmt(v)}</span></div>`).join('');if(r.recap&&Object.keys(r.recap).length)body+='<h3 style="margin-top:23px">Metrik pembelajaran · bukan tambahan ranking</h3>'+[['refreshment','Refreshment'],['pre2','Pre-test Day 2'],['post2','Post-test Day 2'],['pre3','Pre-test Day 3'],['post3','Post-test Day 3']].map(([k,l])=>`<div class="detail-row"><span>${l}</span><span>${fmt(r.recap[k])}</span></div>`).join('');}
 if(!individual){body+='<h3 style="margin-top:23px">Anggota kelompok</h3>'+data().participants.filter(p=>p.groupId===r.id).map(p=>`<div class="detail-row"><span>${h(p.name)}</span><span>${h(p.dealer)}</span></div>`).join('');if(year===2025)body+=`<p class="small-note">Rating tugas Day 2: ${h(r.legacyInputs.tasks2.join(' / '))}<br>Rating tugas Day 3: ${h(r.legacyInputs.tasks3.join(' / '))}<br>Rating maksimal 4; dinormalisasi satu kali oleh rumus.</p>`;}
 if(r.reference)body+=`<p class="small-note">Total arsip: ${fmt(r.reference.total)} · sumber: ${h(individual?r.source?.score:r.source)}</p>`;
 if(r.missing?.length)body+=notice('Belum lengkap: '+h(r.missing.join(', ')));
 modal(r.name,h(individual?r.dealer+' · '+groupName(r.groupId):r.id),body,btn('Tutup','close'));
}
async function importFile(file){
 if(!file)return;toast('Membaca dan memvalidasi '+file.name+'...');
 try{
  const buf=await file.arrayBuffer();let hash='';if(globalThis.crypto?.subtle)hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',buf))).map(b=>b.toString(16).padStart(2,'0')).join('');
  if(hash&&(data().importHistory||[]).some(e=>e.hash===hash)){toast('File identik sudah diterapkan pada sesi ini. Tidak diimpor dua kali.');return;}
  const p=await prepareImport(file,data());p.hash=hash;
  const oldRows=compute(data(),'individual'),newRows=compute(p.data,'individual');p.changed=newRows.filter(n=>{const o=oldRows.find(o=>o.id===n.id);return !o||Math.abs((n.total??-1)-(o.total??-1))>1e-7||n.name!==o.name;}).length;
  const oldGroups=compute(data(),'group'),newGroups=compute(p.data,'group');p.changedGroups=newGroups.filter(n=>{const o=oldGroups.find(o=>o.id===n.id);return !o||Math.abs((n.total??-1)-(o.total??-1))>1e-7||n.name!==o.name;}).length;
  pending=p;
  const check=referenceCheck(p.data);
  modal('Pratinjau impor',h(p.fileName),`<div class="detail-metrics"><div class="detail-metric"><span>Peserta</span><strong>${p.data.participants.length}</strong></div><div class="detail-metric"><span>Kelompok</span><strong>${p.data.groups.length}</strong></div><div class="detail-metric"><span>Individu berubah</span><strong>${p.changed}</strong></div><div class="detail-metric"><span>Kelompok berubah</span><strong>${p.changedGroups}</strong></div></div>${notice('<strong>Belum diterapkan.</strong> Impor mengganti data sumber terkait; tidak menambahkan nilai duplikat.')}<p>Jenis sumber: <strong>${h(p.kind)}</strong></p>${p.notes.map(n=>`<p class="small-note">${h(n)}</p>`).join('')}${year===2025?`<p class="small-note">Cocok arsip: ${check.matching}/${check.checked}. Selisih akibat pembulatan atau pembaruan sumber tetap bisa diperiksa pada Aturan & audit.</p>`:''}<div class="table-wrap"><table><thead><tr><th>Preview peserta</th><th class="num">Skor terhitung</th></tr></thead><tbody>${newRows.slice(0,5).map(r=>`<tr><td>${h(r.name)}</td><td class="num">${fmt(r.total)}</td></tr>`).join('')}</tbody></table></div>`,btn('Batal','close')+`<button class="btn primary" data-action="apply-import">Terapkan impor</button>`);
 }catch(e){toast('Impor ditolak: '+e.message);}
}
function applyImport(){if(!pending)return;const p=pending;const history=[...(data().importHistory||[])];history.push({at:new Date().toISOString(),fileName:p.fileName,kind:p.kind,hash:p.hash,summary:p.changed+' individu; '+p.changedGroups+' kelompok berubah'});p.data.importHistory=history;datasets[year]=p.data;closeModal();render();toast('Impor diterapkan. Skor dan peringkat telah dihitung ulang.');}
function exportCSV(){const cs=year===2025?['Day 1','Day 2','Day 3','Day 4']:rulesStatus(data(),scope).components.map(c=>c.label);const rows=[['program_year','dataset_status','scope','rank','id','name','main_dealer','group',...cs,'total','rules_version'],...filteredRows().map(r=>[year,statusLabel(),scope,r.rank,r.id,r.name,r.dealer||'',r.groupId||r.id,...(r.days||[]),r.total,data().rulesVersion||'legacy-effective-2025'])];download('SFMDP_'+year+'_'+scope+'_'+(year===2025?'DATA_UJI':'PROVISIONAL')+'.csv','\uFEFF'+csvText(rows),'text/csv;charset=utf-8');}
function template(name){const d=data();let rows=[];
 if(name==='Peserta')rows=[['program_year','participant_id','name','main_dealer','group_id','group_name']];
 if(name==='Komponen')rows=[['program_year','component_id','label','scope','max_score','weight','enabled'],...(d.components||[]).map(c=>[2026,c.id,c.label,c.scope,c.max,c.weight,c.enabled?'true':'false'])];
 if(name.startsWith('Nilai_'))rows=[['program_year','entity_id','component_id','value']];download(name+'_2026.csv','\uFEFF'+csvText(rows),'text/csv;charset=utf-8');
}
function invalidateRules(){data().rulesApproved=false;data().rulesApprovedBy='';data().rulesVersion='2026-draft-'+new Date().toISOString().replace(/[:.]/g,'-');}
function approveDialog(){
 if(!rulesStatus(data(),'individual').valid||!rulesStatus(data(),'group').valid){toast('Bobot individu dan kelompok harus masing-masing 100% sebelum persetujuan.');return;}
 modal('Catat persetujuan internal','Catatan lokal; belum merupakan workflow persetujuan server.',notice('Hanya tandai setelah Project Lead/fasilitator menyetujui komponen, maksimum, bobot, dan aturan seri.')+`<div class="form-field"><label for="approver">Nama pemberi persetujuan internal</label><input id="approver" type="text" maxlength="100" placeholder="Nama pihak yang benar-benar menyetujui"></div><label style="font-size:12px"><input id="approval-confirm" type="checkbox"> Saya telah mendapatkan persetujuan atas versi aturan ini.</label>`,btn('Batal','close')+`<button class="btn primary" data-action="confirm-approval">Simpan catatan persetujuan</button>`);
}
function addComponent(s){modal('Tambah komponen',labelScope(s),`<input id="new-scope" type="hidden" value="${s}"><div class="form-grid"><div class="form-field"><label for="component-id">ID (unik, tanpa spasi)</label><input id="component-id" type="text" placeholder="contoh: prelearning"></div><div class="form-field"><label for="component-label">Nama komponen</label><input id="component-label" type="text" placeholder="Nama komponen"></div><div class="form-field"><label for="component-max">Nilai maksimum</label><input id="component-max" type="number" value="100" min="1"></div></div><p class="small-note">Bobot awal 0. Komponen baru tidak ikut ranking sebelum bobot ditetapkan.</p>`,btn('Batal','close')+`<button class="btn primary" data-action="save-component">Tambahkan</button>`);}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-action]');if(!t)return;const a=t.dataset.action;
 if(a==='nav'){page=t.dataset.page;query='';groupFilter='';render();}
 if(a==='to-import'){page='import';render();}
 if(a==='scope'){scope=t.dataset.scope;groupFilter='';query='';render();}
 if(a==='detail')detail(t.dataset.id,t.dataset.scope);
 if(a==='close')closeModal();if(a==='apply-import')applyImport();
 if(a==='backup')download('SFMDP_'+year+'_BACKUP_'+(data().isAnonymous?'ANONIM':'INTERNAL')+'.json',JSON.stringify(data(),null,2),'application/json');
 if(a==='csv')exportCSV();if(a==='print')window.print();if(a==='template')template(t.dataset.template);
 if(a==='present'){page='leaderboard';present=true;query='';groupFilter='';render();window.scrollTo(0,0);}
 if(a==='exit-present'){present=false;render();}
 if(a==='approve')approveDialog();
 if(a==='confirm-approval'){const name=document.getElementById('approver').value.trim();if(!name||!document.getElementById('approval-confirm').checked)return toast('Isi nama dan konfirmasi persetujuan terlebih dahulu.');data().rulesApproved=true;data().rulesApprovedBy=name;data().rulesApprovedAt=new Date().toISOString();closeModal();render();toast('Persetujuan internal dicatat secara lokal.');}
 if(a==='add-component')addComponent(t.dataset.scope);
 if(a==='save-component'){const id=document.getElementById('component-id').value.trim(),label=document.getElementById('component-label').value.trim(),max=Number(document.getElementById('component-max').value),s=document.getElementById('new-scope').value;if(!/^[a-z][a-z0-9_]{1,49}$/.test(id)||!label||!(max>0)||data().components.some(c=>c.id===id))return toast('Periksa ID unik (huruf kecil/angka/_), nama, dan maksimum.');data().components.push({id,label,max,scope:s,weight:0,enabled:true});invalidateRules();closeModal();render();}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='project-year'){year=Number(t.value);query='';groupFilter='';mode='computed';selectedComponent='';render();}
 if(t.id==='mode'){mode=t.value;render();}if(t.id==='group-filter'){groupFilter=t.value;render();}
 if(t.id==='import-file')importFile(t.files[0]);
 if(t.id==='score-scope'){scoreScope=t.value;selectedComponent='';render();}if(t.id==='score-component'){selectedComponent=t.value;render();}
 for(const key of ['weight','max','enabled'])if(t.dataset[key]){const c=data().components.find(c=>c.id===t.dataset[key]);const val=key==='enabled'?t.checked:Number(t.value);if(key==='weight'&&(!Number.isFinite(val)||val<0||val>100)||key==='max'&&(!Number.isFinite(val)||val<=0)){toast('Nilai aturan tidak valid.');render();return;}c[key]=val;invalidateRules();render();}
 if(t.dataset.scoreId){const list=scoreScope==='individual'?'individualScores':'groupScores',c=data().components.find(c=>c.id===selectedComponent),value=numberOrNull(t.value);if(value!==null&&(value<0||value>c.max)){toast('Nilai harus 0 sampai '+c.max+'.');render();return;}const old=data()[list].find(s=>s.entityId===t.dataset.scoreId&&s.componentId===selectedComponent);if(old)old.value=value;else data()[list].push({entityId:t.dataset.scoreId,componentId:selectedComponent,value});render();toast('Nilai lokal diperbarui; ranking dihitung ulang.');}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;const cursor=e.target.selectionStart;render();const input=document.getElementById('search');input.focus();input.setSelectionRange(cursor,cursor);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('modal-root').innerHTML)closeModal();else if(present){present=false;render();}}if(e.key==='Enter'&&e.target.matches('tr[data-action="detail"]'))e.target.click();if(e.key==='Tab'&&document.querySelector('.modal')){const els=[...document.querySelector('.modal').querySelectorAll('button,input,select,[tabindex="0"]')].filter(x=>!x.disabled);const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
render();
</script></body></html>
